[tool.poetry]
name = "notes"
version = "0.1.0"
description = "A notes app to write handy notes"
authors = ["Your Name you@example.com"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
click = "^8.5.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.scripts]
notes = "notes:cli" #entry point to the cli
